<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irotona</title>
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="topbar">
      <div id="info"></div>
      <div id="plane-view" role="group" hidden>
        <button id="plane-focused" type="button" aria-pressed="true"></button>
        <button id="plane-full" type="button" aria-pressed="false"></button>
      </div>
      <button id="circle-model" type="button" hidden>HSV</button>
      <button id="pointer-info" type="button" aria-pressed="false">i</button>
      <button id="palette-pin" type="button" aria-pressed="false" aria-label="ピン留め">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 2h4l-.4 4 2.4 3H4l2.4-3L6 2Zm2 7v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="gamut-btn" title="Toggle gamut warning">&#9888;</button>
    </div>
    <div class="container" data-plane-size="medium">
      <div class="wheel-stack">
        <div class="wheel-layers">
          <div class="wheel-surface"><canvas id="wheel"></canvas></div>
          <canvas id="wheel-marker" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="slider-stack">
        <canvas id="slider"></canvas>
      </div>
      <div class="palette-footer">
        <div id="plane-comparison" role="group" hidden>
          <button id="restore-sampled-color" type="button" disabled></button>
        </div>
        <div id="color-slots" role="group">
          <button class="color-slot" type="button">+</button>
          <button class="color-slot" type="button">+</button>
          <button class="color-slot" type="button">+</button>
          <button class="color-slot" type="button">+</button>
        </div>
        <button id="cycle-palette" type="button">
          <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M1.5 1.5h11v11h-11zM7 1.5v11M1.5 7h11" fill="none" stroke="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
