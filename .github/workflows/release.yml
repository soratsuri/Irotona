name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          npm run release:check -- "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }
          "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows x64 portable executable
        shell: pwsh
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $env:CARGO_ENCODED_RUSTFLAGS = @("--remap-path-prefix=$cargoRoot=/cargo", "--remap-path-prefix=$PWD=/source") -join [char]31
          npm run tauri build -- --no-bundle -- --locked

      - name: Stage release assets
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "release-assets"
          $assetDir = & ./scripts/stage-release-assets.ps1 `
            -Version $env:VERSION `
            -Destination $assetDir
          "asset_dir=$assetDir" >> $env:GITHUB_OUTPUT

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          $assetFiles = Get-ChildItem -LiteralPath $env:ASSET_DIR -File |
            Select-Object -ExpandProperty FullName
          $releaseArgs = @(
            'release', 'create', $env:TAG_NAME,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--draft', '--generate-notes',
            '--title', "Irotona $env:TAG_NAME"
          )
          gh @releaseArgs @assetFiles
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create draft release $env:TAG_NAME. Review any existing draft before retrying."
          }
